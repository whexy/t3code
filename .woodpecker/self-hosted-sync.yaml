# Keeps the `self-hosted` branch on top of the latest published stable release.
# Checks hourly from the repository cron `self-hosted-sync` on branch
# `self-hosted`, schedule `23 * * * *`.
#
# When the stable release changes, the fork's patches are rebased onto it and
# pushed back, which starts self-hosted-build.yaml. Nightlies and unreleased
# upstream commits do not trigger builds. An unchanged stable tag ends the run
# without pushing. A failed rebase pushes nothing, so the last image keeps
# serving until the patch is fixed. The push is leased on the commit this run
# started from, so a patch pushed meanwhile is never overwritten.
#
# Pushes as the `whexy-bot` GitHub App through the secrets `github_app_id`,
# `github_app_installation_id`, and `github_app_private_key`.
when:
  event: cron

# The rebase needs the branch's history back to its upstream merge base.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: rebase
    image: node:24
    environment:
      GITHUB_APP_ID:
        from_secret: github_app_id
      GITHUB_APP_INSTALLATION_ID:
        from_secret: github_app_installation_id
      GITHUB_APP_PRIVATE_KEY:
        from_secret: github_app_private_key
    commands:
      - release_tag="$(node scripts/self-hosted/stable-release.ts)"
      - git fetch --no-tags https://github.com/pingdotgg/t3code.git +refs/heads/main:refs/remotes/upstream/main "+refs/tags/$release_tag:refs/remotes/upstream/stable"
      - release_sha="$(git rev-parse 'refs/remotes/upstream/stable^{commit}')"
      # The merge base excludes upstream commits when moving an existing main-based fork to stable.
      - upstream_base="$(git merge-base HEAD refs/remotes/upstream/main)"
      - |
        if [ "$upstream_base" = "$release_sha" ]; then
          echo "self-hosted already follows stable $release_tag."
          exit 0
        fi
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      - git rebase --onto "$release_sha" "$upstream_base"
      - token="$(node scripts/self-hosted/github-app-token.ts)"
      - git push --force-with-lease="self-hosted:$CI_COMMIT_SHA" "https://x-access-token:$token@github.com/${CI_REPO}.git" HEAD:self-hosted
