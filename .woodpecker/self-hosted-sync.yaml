# Keeps the `self-hosted-nightly` branch on top of the latest published
# nightly release. Checks hourly from the repository cron
# `self-hosted-nightly-sync` on branch `self-hosted-nightly`, schedule
# `53 * * * *`.
#
# When the nightly release changes, the fork's patches are rebased onto it,
# nix/sources.json is pinned to it in a `chore(nix): pin sources` commit on
# top, and the branch is pushed back, which starts self-hosted-build.yaml and
# self-hosted-nix.yaml. Each rebase drops the previous pin commit, so the
# branch carries one. Unreleased upstream commits do not trigger builds. A
# nightly the branch already follows and pins ends the run without pushing. A
# failed rebase or pin pushes nothing, so the last build keeps serving until
# the patch is fixed, and reports the failure to T3 Code, which starts an
# agent run to repair the branch. The push is leased on the commit this run
# started from, so a patch pushed meanwhile is never overwritten.
#
# Pushes as the `whexy-bot` GitHub App through the secrets `github_app_id`,
# `github_app_installation_id`, and `github_app_private_key`. Reports through
# the secret `t3_repair_webhook`, a T3 Code scheduled task's webhook URL.
when:
  event: cron

# The rebase needs the branch's history back to its upstream merge base.
# Submodules stay out for the reason in self-hosted-build.yaml. The workspace
# stays on the clone's node, and nix-ci runs only on amd64.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: amd64
    settings:
      partial: false
      depth: 0
      recursive: false

steps:
  - name: rebase
    image: node:24
    commands:
      - release_tag="$(node scripts/self-hosted/nightly-release.ts)"
      - mkdir -p .sync && printf '%s' "$release_tag" > .sync/release-tag
      - git fetch --no-tags https://github.com/pingdotgg/t3code.git +refs/heads/main:refs/remotes/upstream/main "+refs/tags/$release_tag:refs/remotes/upstream/nightly"
      - release_sha="$(git rev-parse 'refs/remotes/upstream/nightly^{commit}')"
      - upstream_base="$(git merge-base HEAD refs/remotes/upstream/main)"
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      # Woodpecker expands ${...} itself when it reads this file; $$ leaves it to the shell.
      - |
        if [ "$upstream_base" != "$release_sha" ]; then
          GIT_SEQUENCE_EDITOR="sed -i -E '/^pick [0-9a-f]+ chore\(nix\): pin sources /s/^pick/drop/'" \
            git rebase -i --onto "$release_sha" "$upstream_base"
        elif grep -qF "\"version\": \"$${release_tag#v}\"" nix/sources.json; then
          echo "self-hosted-nightly already follows and pins nightly $release_tag."
          touch .sync/done
        fi

  - name: pin-sources
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.4
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: amd64
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
    commands:
      - if [ -e .sync/done ]; then exit 0; fi
      - release_tag="$(cat .sync/release-tag)"
      - nix shell --inputs-from . nixpkgs#jq nixpkgs#gnused --command nix/update-sources.sh "$release_tag"
      - git add nix/sources.json
      - if git diff --cached --quiet; then exit 0; fi
      - |
        message="chore(nix): pin sources for $release_tag"
        if git log -1 --format=%s | grep -q '^chore(nix): pin sources '; then
          git commit --amend -m "$message"
        else
          git commit -m "$message"
        fi

  - name: push
    image: node:24
    environment:
      GITHUB_APP_ID:
        from_secret: github_app_id
      GITHUB_APP_INSTALLATION_ID:
        from_secret: github_app_installation_id
      GITHUB_APP_PRIVATE_KEY:
        from_secret: github_app_private_key
    commands:
      - if [ -e .sync/done ] || [ "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA" ]; then exit 0; fi
      - token="$(node scripts/self-hosted/github-app-token.ts)"
      - git push --force-with-lease="self-hosted-nightly:$CI_COMMIT_SHA" "https://x-access-token:$token@github.com/${CI_REPO}.git" HEAD:self-hosted-nightly

  - name: report-failure
    image: node:24
    when:
      status: failure
    environment:
      T3_REPAIR_WEBHOOK:
        from_secret: t3_repair_webhook
    commands:
      # A conflict stops the rebase before the fork's later commits, this script's among them.
      - git rebase --abort 2>/dev/null || true
      - node scripts/self-hosted/report-failure.ts sync
