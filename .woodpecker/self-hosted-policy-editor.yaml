# Publishes the managed-policy editor (`apps/policy-editor`) as
# `ghcr.io/whexy/t3code-policy-editor` from the `self-hosted-nightly` branch.
# It runs beside self-hosted-build.yaml on the same events, so each nightly
# rebase republishes the editor with that nightly's policy rules, and both
# images share the `1.1.<pipeline>` version. A pull request into the branch
# runs the checks without publishing; a failed push reports to T3 Code like
# the web build does.
#
# The editor is not a workspace package: it borrows the web app's
# dependencies, and the server's through its own source files, so the
# install covers both.
#
# Needs the secrets `ghcr_token`, `ci_cache_access_key`, `ci_cache_secret_key`
# and `t3_repair_webhook`, as self-hosted-build.yaml documents.
variables:
  - &amd64
    kubernetes:
      nodeSelector:
        kubernetes.io/arch: amd64
  # The checks and the image build each outgrow the LimitRange's 2Gi step default.
  - &resources
    kubernetes:
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 6Gi
  # Its own key, so this workflow and the web build never overwrite each
  # other's archive for a different filter.
  - &pnpm_cache
    key: 'pnpm-metadata-policy-editor-{{ arch }}-{{ hashFiles "pnpm-lock.yaml" }}'
    restore_keys:
      - "pnpm-metadata-policy-editor-{{ arch }}-"
    paths:
      - .pnpm-cache
    access_key:
      from_secret: ci_cache_access_key
    secret_key:
      from_secret: ci_cache_secret_key
  - &publish
    event: [push, manual]
    branch: self-hosted-nightly

when:
  event: [push, manual, pull_request]
  branch: self-hosted-nightly

# See self-hosted-build.yaml for why submodules stay out.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *resources
    settings:
      recursive: false

steps:
  - name: restore-pnpm
    image: ghcr.io/whexy/ci-cache:0.1.0-alpha.3
    backend_options: *amd64
    settings:
      <<: *pnpm_cache
      mode: restore

  # Install scripts only build native modules the server runs and the editor never loads.
  - name: install
    image: node:24
    backend_options: *resources
    commands:
      - corepack pnpm install --frozen-lockfile --ignore-scripts --config.cache-dir=.pnpm-cache --filter=@t3tools/web... --filter=t3...

  - name: save-pnpm
    image: ghcr.io/whexy/ci-cache:0.1.0-alpha.3
    backend_options: *amd64
    settings:
      <<: *pnpm_cache
      mode: save

  - name: policy-editor
    image: node:24
    backend_options: *resources
    commands:
      - export PATH="$PWD/node_modules/.bin:$PATH"
      - cd apps/policy-editor
      - vp test run
      - tsc --noEmit -p .
      - vp build
      - mkdir -p ../../.sync/policy-editor-image
      - cp serve.ts ../../.sync/policy-editor-image/
      - cp -R dist ../../.sync/policy-editor-image/dist

  - name: policy-editor-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    when: *publish
    backend_options: *resources
    settings:
      platforms: linux/amd64
      registry: ghcr.io
      username: whexy
      password:
        from_secret: ghcr_token
      repo: ghcr.io/whexy/t3code-policy-editor
      dockerfile: apps/policy-editor/Dockerfile
      context: .sync/policy-editor-image
      tags:
        - sha-${CI_COMMIT_SHA:0:12}
        - 1.1.${CI_PIPELINE_NUMBER}
      default_labels: false
      labels:
        - org.opencontainers.image.source=https://github.com/whexy/t3code
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
      provenance: false
      mtu: 1230
      storage_path: /woodpecker/docker

  - name: report-failure
    image: node:24
    when:
      - <<: *publish
        status: failure
    environment:
      T3_REPAIR_WEBHOOK:
        from_secret: t3_repair_webhook
    commands:
      - node scripts/self-hosted/report-failure.ts build
