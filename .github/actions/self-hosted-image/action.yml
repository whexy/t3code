name: Build a self-hosted image
description: >-
  Builds a linux/amd64 image. Outside pull requests it pushes the image to
  ghcr.io/<repository owner>/t3code-<name> by digest only, which nothing deploys until
  self-hosted-build.yml's promote job tags it, and outputs the digest.
inputs:
  name:
    description: Image name; it is pushed as ghcr.io/<repository owner>/t3code-<name>
    required: true
  dockerfile:
    description: Dockerfile path
    required: true
  context:
    description: Build context directory
    required: true
outputs:
  digest:
    description: The pushed image's digest; empty on pull requests
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        # One manifest per tag, so ghcr.io's untagged versions are only superseded builds.
        provenance: false
        sbom: false
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        outputs: ${{ github.event_name != 'pull_request' && format('type=image,name=ghcr.io/{0}/t3code-{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, inputs.name) || 'type=cacheonly' }}
