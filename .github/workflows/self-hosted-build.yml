# Checks and publishes the fork's self-hosted-nightly branch. Each check job
# also hands its result over: an image pushed by digest only, or a t3-server
# closure pushed to Cachix. Neither deploys anything until the promote jobs
# tag the images and the commit, which they do only when every check passed
# and the branch still points at this commit; then the dotfiles pin lane
# starts. A failure is reported to T3 Code, which starts an agent run to
# repair the branch, and the last good build keeps serving.
#
# Pushes come from self-hosted-rebase.yml (as the whexy-bot App) and from
# merged pull requests. Pull requests run the checks without the macOS leg and
# the desktop builds, and push nothing. Desktop builds do not block the
# images or the pin; a passing set becomes a prerelease once the gate does.
#
# Images get `sha-<12 hex>` and `1.2.<run_number>`, so the version only grows.
# Retry with workflow_dispatch on the branch head, never "Re-run": a re-run
# reuses run_number, so the publishing jobs refuse it. Never rename this file:
# run_number counts per workflow file, and a new name restarts 1.2.N.
name: self-hosted-build

on:
  push:
    branches: [self-hosted-nightly]
  workflow_dispatch:
  pull_request:
    branches: [self-hosted-nightly]

# A newer pending publish replaces an older one; pull requests and runs
# dispatched on other branches get their own group so they never displace a
# pending publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || github.ref != 'refs/heads/self-hosted-nightly' && format('build-{0}', github.ref_name) || 'build-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  web-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # The branch commits no lockfile changes but the apps/mcp importer, which
      # can fall behind upstream's catalog, so resolve before the frozen install.
      - name: Install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          vp install --lockfile-only
          vp install --frozen-lockfile --filter=@t3tools/scripts... --filter=@t3tools/web...

      # Tests run from their package: a repo-root run loads every package's
      # config, and the filtered install lacks the mobile app's.
      - name: Test and typecheck
        run: |
          (cd apps/web && vp test run --project unit src/connection/sharedCatalog.test.ts src/connection/storage.test.ts)
          (cd scripts && vp test run --config ../vite.config.ts --dir . self-hosted)
          vp run --filter @t3tools/scripts typecheck
          vp run --filter @t3tools/web typecheck

      # The storage tests expect the browser catalog, so only the build sees the shared one.
      - name: Build
        env:
          VITE_HOSTED_APP_CHANNEL: nightly
          VITE_SHARED_CATALOG_PATH: /__t3code/shared-catalog
          T3CODE_FEATURE_SECRETS: "1"
        run: |
          vp run --filter @t3tools/web build
          node scripts/apply-web-brand-assets.ts --channel nightly
          mkdir -p "$RUNNER_TEMP/context"
          cp scripts/self-hosted/server.ts "$RUNNER_TEMP/context/"
          cp -R apps/web/dist "$RUNNER_TEMP/context/web"

      - id: image
        uses: ./.github/actions/self-hosted-image
        with:
          name: hub
          dockerfile: scripts/self-hosted/Dockerfile
          context: ${{ runner.temp }}/context

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          vp install --lockfile-only
          vp install --frozen-lockfile --filter=@t3tools/mcp...

      - name: Test, typecheck and bundle
        run: |
          (cd apps/mcp && vp test run)
          vp run --filter @t3tools/mcp typecheck
          (cd apps/mcp && vp pack)
          mkdir -p "$RUNNER_TEMP/context"
          cp apps/mcp/dist/bin.mjs "$RUNNER_TEMP/context/"

      - id: image
        uses: ./.github/actions/self-hosted-image
        with:
          name: mcp
          dockerfile: scripts/self-hosted/mcp.Dockerfile
          context: ${{ runner.temp }}/context

  policy-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # The editor is not a workspace package: it borrows the web app's
      # dependencies and the server's source files. Install scripts only build
      # native modules the server runs and the editor never loads.
      - name: Install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          vp install --lockfile-only
          vp install --frozen-lockfile --ignore-scripts --filter=@t3tools/web... --filter=t3...

      - name: Test, typecheck and build
        working-directory: apps/policy-editor
        run: |
          vp test run
          ../../node_modules/.bin/effect-tsgo tsrs --noEmit -p .
          vp build
          mkdir -p "$RUNNER_TEMP/context"
          cp serve.ts "$RUNNER_TEMP/context/"
          cp -R dist "$RUNNER_TEMP/context/dist"

      - id: image
        uses: ./.github/actions/self-hosted-image
        with:
          name: policy-editor
          dockerfile: apps/policy-editor/Dockerfile
          context: ${{ runner.temp }}/context

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # t3-push imports the relay's APNs modules by path, so it needs the
      # relay's dependencies as well as its own.
      - name: Install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          vp install --lockfile-only
          vp install --frozen-lockfile --ignore-scripts --filter=@t3tools/push... --filter=t3code-relay...

      - name: Test, typecheck and bundle
        run: |
          (cd apps/push && vp test run)
          vp run --filter @t3tools/push typecheck
          (cd apps/push && vp pack)
          mkdir -p "$RUNNER_TEMP/context"
          cp apps/push/dist/bin.mjs "$RUNNER_TEMP/context/"

      - id: image
        uses: ./.github/actions/self-hosted-image
        with:
          name: push
          dockerfile: apps/push/Dockerfile
          context: ${{ runner.temp }}/context

  nix-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      out: ${{ steps.check.outputs.out }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # Pushes only the t3-server closure below, not every path the build makes.
      - uses: cachix/cachix-action@v17
        with:
          name: whexy-t3code
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true

      - id: check
        run: scripts/self-hosted/nix-check.sh x86_64-linux

      - if: github.event_name != 'pull_request'
        env:
          OUT: ${{ steps.check.outputs.out }}
        run: cachix push whexy-t3code "$OUT"

  nix-darwin:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      out: ${{ steps.check.outputs.out }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: whexy-t3code
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - id: check
        run: scripts/self-hosted/nix-check.sh aarch64-darwin

      - env:
          OUT: ${{ steps.check.outputs.out }}
        run: cachix push whexy-t3code "$OUT"

  # The desktop app keeps upstream's nightly version, since clients compare
  # nightly build numbers with the servers' (apps/web/src/versionSkew.ts).
  # So each upstream nightly gets one release, from the first commit on it
  # whose desktop builds pass; later commits on that nightly ship with the next.
  desktop-plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      mac: ${{ steps.plan.outputs.mac }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: nix/sources.json
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_APP_ID: ${{ vars.MACOS_APP_ID }}
          RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          version="$(jq -r .version nix/sources.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if found="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "state=DESKTOP_PUBLISHED version=$version" | tee -a "$GITHUB_STEP_SUMMARY"
            echo build=false >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$found" != *"release not found"* ]]; then
            echo "$found" >&2
            exit 1
          fi
          echo build=true >> "$GITHUB_OUTPUT"
          # An unsigned Mac build cannot update itself, so it is not built at all.
          if [[ -n "$DEVELOPER_ID_P12" && -n "$DEVELOPER_ID_P12_PASSWORD" && -n "$PROVISIONING_PROFILE" && -n "$ASC_PRIVATE_KEY" && -n "$APPLE_TEAM_ID" && -n "$MACOS_APP_ID" && -n "$RP_DOMAINS" ]]; then
            echo mac=true >> "$GITHUB_OUTPUT"
          else
            echo "state=MAC_SKIPPED reason=Developer ID signing not configured" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # What release.yml's build_bundle makes for release-desktop.yml: the server
  # bundle with its web client, and the Electron main. No T3 Connect config,
  # like the fork's server and hub.
  desktop-bundle:
    needs: desktop-plan
    if: needs.desktop-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          vp install --lockfile-only
          vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build
        env:
          VERSION: ${{ needs.desktop-plan.outputs.version }}
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run build:desktop:bundle

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # The Windows build embeds this job's CLI archive as its WSL runtime.
  desktop-linux:
    needs: [desktop-plan, desktop-bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-latest
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true
      relay_client_tracing: false
      version: ${{ needs.desktop-plan.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  # Unsigned: electron-updater checks an update's signature only when the
  # build names a publisher, and only signing names one.
  desktop-windows:
    needs: [desktop-plan, desktop-bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: ubuntu-latest
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      relay_client_tracing: false
      version: ${{ needs.desktop-plan.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  # Signed with the team's Developer ID under its own bundle id (MACOS_APP_ID).
  # MACOS_NOTARIZE=false leaves notarizing to desktop-mac-notarize.
  desktop-mac:
    needs: [desktop-plan, desktop-bundle]
    if: needs.desktop-plan.outputs.mac == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
    with:
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      launch_check: true
      relay_client_tracing: false
      version: ${{ needs.desktop-plan.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  # Apple's services drop connections from GitHub's Macs often enough that
  # notarizing inside the build failed half its runs, so it happens here,
  # where another attempt costs minutes instead of a rebuild. The ticket is
  # not stapled: the updater and dotfiles' install never ask Gatekeeper, and
  # Gatekeeper looks a downloaded app up online.
  desktop-mac-notarize:
    needs: desktop-mac
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            flake.nix
            flake.lock
          sparse-checkout-cone-mode: false
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: mac
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          rcodesign() { nix run --inputs-from . nixpkgs#rcodesign -- "$@"; }
          key="$RUNNER_TEMP/notary"
          (umask 077 && mkdir "$key" && printf '%s\n' "$ASC_PRIVATE_KEY" > "$key/AuthKey.p8")
          rcodesign encode-app-store-connect-api-key -o "$key/key.json" "$ASC_ISSUER_ID" "$ASC_KEY_ID" "$key/AuthKey.p8"
          app=(mac/*.zip)
          for attempt in 1 2 3 4; do
            if rcodesign notary-submit --api-key-file "$key/key.json" --wait --max-wait-seconds 900 "${app[0]}"; then
              echo "notarized: ${app[0]##*/} (attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            ((attempt < 4)) && sleep $((attempt * 120))
          done
          exit 1

  # A newer push builds itself, so a superseded commit is never tagged.
  gate:
    needs: [web-hub, mcp, policy-editor, push, nix-linux, nix-darwin]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/self-hosted-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_OUT: ${{ needs.nix-linux.outputs.out }}
          DARWIN_OUT: ${{ needs.nix-darwin.outputs.out }}
        run: |
          echo "t3-server: $LINUX_OUT $DARWIN_OUT"
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/self-hosted-nightly" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "state=SUPERSEDED commit=$GITHUB_SHA head=$head" | tee -a "$GITHUB_STEP_SUMMARY"
            echo current=false >> "$GITHUB_OUTPUT"
          fi

  promote-images:
    needs: [gate, web-hub, mcp, policy-editor, push]
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: current
        uses: ./.github/actions/self-hosted-current
      - if: steps.current.outputs.current == 'true'
        env:
          HUB: ${{ needs.web-hub.outputs.digest }}
          MCP: ${{ needs.mcp.outputs.digest }}
          POLICY_EDITOR: ${{ needs.policy-editor.outputs.digest }}
          PUSH: ${{ needs.push.outputs.digest }}
        run: |
          promote() {
            local image="ghcr.io/whexy/t3code-$1"
            docker buildx imagetools create --prefer-index=false \
              -t "$image:sha-${GITHUB_SHA::12}" -t "$image:1.2.$GITHUB_RUN_NUMBER" "$image@${2:?no digest for $1}"
          }
          promote hub "$HUB"
          promote mcp "$MCP"
          promote policy-editor "$POLICY_EDITOR"
          promote push "$PUSH"
          echo "images: 1.2.$GITHUB_RUN_NUMBER sha-${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"

  # ArgoCD Image Updater is the fallback for these images, not the trigger.
  # GHCR delivers a digest event for a promoted tag, not always a tag event,
  # and the updater's 30m poll can still reuse the tag list it read before the
  # tag existed, so the hub has sat a build behind for up to an hour. This run
  # already knows the tag it just promoted, so write it into clusters-work
  # here: one writer, immediately after the images exist.
  deploy:
    needs: [gate, promote-images]
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: whexy
          repositories: clusters-work

      - uses: actions/checkout@v6
        with:
          repository: whexy/clusters-work
          ref: master
          token: ${{ steps.token.outputs.token }}
          sparse-checkout: gitops/apps
          sparse-checkout-cone-mode: false

      - name: Bump the t3code images
        env:
          TAG: 1.2.${{ github.run_number }}
        run: |
          git config user.name "whexy-bot[bot]"
          git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
          for app in t3code-hub t3code-mcp t3code-policy-editor t3code-push; do
            [ -f "gitops/apps/$app/kustomization.yaml" ] || continue
            sed -i "0,/^\( *\)newTag: .*/s//\1newTag: $TAG/" "gitops/apps/$app/kustomization.yaml"
          done
          git diff --stat
          if git diff --quiet; then
            echo "clusters-work already at $TAG"
            exit 0
          fi
          git commit -am "build: t3code images $TAG"
          git push origin master

  # Hosts fetch the flake by commit; the tag keeps it fetchable after the next
  # rebase force-pushes the branch.
  promote-pin:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - id: current
        uses: ./.github/actions/self-hosted-current
      - if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pin/${GITHUB_SHA::12}"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$GITHUB_SHA" ]]
          fi

  # The preview app signed for the fork's Apple team (apps/mobile/forkIos.ts),
  # uploaded to TestFlight as 1.2.<run_number>. Archiving signs with the
  # Development identity and profiles Xcode makes through the API key; the
  # export re-signs with Distribution and the App Store profiles that
  # scripts/self-hosted/ios-profiles.ts installs. Without the signing secrets
  # the job only says so and succeeds.
  ios-testflight:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      # scripts/self-hosted/ios-ota-publish.sh resolves the runtime version the
      # same way; a build that computes another one never receives an update.
      EXPO_UPDATES_WORKFLOW_OVERRIDE: managed
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_FORK_IOS: "1"
      T3CODE_FORK_IOS_BUILD_NUMBER: ${{ github.run_number }}
      T3CODE_MOBILE_VERSION: 1.2.${{ github.run_number }}
    steps:
      - id: secrets
        env:
          DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [[ -n "$DEVELOPMENT_P12" && -n "$DISTRIBUTION_P12" && -n "$P12_PASSWORD" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "state=IOS_SKIPPED reason=signing secrets missing" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install
        if: steps.secrets.outputs.present == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          vp install --lockfile-only
          vp install --frozen-lockfile --filter=@t3tools/mobile...

      - name: Import signing credentials
        if: steps.secrets.outputs.present == 'true'
        env:
          DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$DEVELOPMENT_P12" "$DISTRIBUTION_P12"; do
            base64 --decode <<< "$p12" > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          done
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        if: steps.secrets.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Prebuild writes these into Info.plist only; without the secret, push stays off.
          T3CODE_PUSH_URL: https://t3-push.clusters.work
          T3CODE_PUSH_TOKEN: ${{ secrets.T3_PUSH_PHONE_TOKEN }}
        run: |
          runtime="$(./node_modules/.bin/expo-updates runtimeversion:resolve --platform ios --workflow managed | tail -1 | jq -r .runtimeVersion)"
          team="$(./node_modules/.bin/expo config --json | jq -r .ios.appleTeamId)"
          echo "IOS_TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "IOS_RUNTIME_VERSION=$runtime" >> "$GITHUB_ENV"
          ./node_modules/.bin/expo prebuild --platform ios --clean
          workspace="$(echo ios/*.xcworkspace)"
          # The share extension's target carries no team of its own.
          xcodebuild archive -quiet \
            -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            DEVELOPMENT_TEAM="$team" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          built="$(cat "$RUNNER_TEMP"/T3Code.xcarchive/Products/Applications/*.app/EXUpdates.bundle/fingerprint)"
          if [[ "$built" != "$runtime" ]]; then
            echo "::error::The archive's runtime version is $built, not $runtime; no over-the-air update would reach it."
            exit 1
          fi

      - id: current
        if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/self-hosted-current

      - name: Upload to TestFlight
        if: steps.current.outputs.current == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            node scripts/self-hosted/ios-profiles.ts "$RUNNER_TEMP/T3Code.xcarchive" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "testflight: $T3CODE_MOBILE_VERSION ($T3CODE_FORK_IOS_BUILD_NUMBER) runtime $IOS_RUNTIME_VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The prerelease is the feed the desktop updater follows: a build made in
  # this repository points at its releases (resolveGitHubPublishConfig in
  # scripts/build-desktop-artifact.ts). Tags are the bare version, which
  # electron-updater accepts and which cannot clash with upstream's v<version>
  # tags in a clone that fetches both.
  publish-desktop:
    needs: [gate, desktop-plan, desktop-linux, desktop-windows, desktop-mac, desktop-mac-notarize]
    if: >-
      !cancelled() && needs.gate.outputs.current == 'true' &&
      needs.desktop-linux.result == 'success' && needs.desktop-windows.result == 'success' &&
      (needs.desktop-mac.result == 'skipped' || needs.desktop-mac-notarize.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - uses: actions/download-artifact@v8
        with:
          # Not desktop-*, which also matches a failed build's launch-check output.
          pattern: desktop-{linux-x64,win-x64,mac-arm64}
          path: release-assets
          merge-multiple: true
      - id: current
        uses: ./.github/actions/self-hosted-current
      - if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.desktop-plan.outputs.version }}
        working-directory: release-assets
        run: |
          rm -f builder-debug.yml
          # release-desktop.yml suffixes Windows manifests by arch for merging;
          # with x64 alone, the feed name is the plain one.
          mv nightly-win-x64.yml nightly.yml
          ls -l
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "T3 Code $VERSION" \
            --notes "The desktop app built from $GITHUB_SHA, on upstream's v$VERSION." ./*
          echo "desktop: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          # dotfiles pins one of the newest; older ones only serve rollbacks.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))] | sort_by(.createdAt) | reverse | .[10:][].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

  # Waits for the desktop release, which the dotfiles pin lane pins on Linux,
  # but not on its success.
  notify:
    needs: [promote-images, promote-pin, publish-desktop]
    if: >-
      !cancelled() && needs.promote-images.result == 'success' && needs.promote-pin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - id: current
        uses: ./.github/actions/self-hosted-current
      - name: Start the dotfiles pin lane
        if: steps.current.outputs.current == 'true'
        env:
          WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
        run: |
          curl -fsS --retry 3 -X POST https://make.clusters.work/api/repos/3/pipelines \
            -H "Authorization: Bearer $WOODPECKER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"branch\":\"master\",\"variables\":{\"T3CODE_FORK_REV\":\"$GITHUB_SHA\"}}" |
            jq -c '{number, status}'
          echo "state=DONE commit=$GITHUB_SHA version=1.2.$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs:
      [
        web-hub,
        mcp,
        policy-editor,
        push,
        nix-linux,
        nix-darwin,
        gate,
        promote-images,
        promote-pin,
        deploy,
        ios-testflight,
        desktop-plan,
        desktop-bundle,
        desktop-linux,
        desktop-windows,
        desktop-mac,
        desktop-mac-notarize,
        publish-desktop,
        notify,
      ]
    if: always() && github.ref == 'refs/heads/self-hosted-nightly' && github.event_name != 'pull_request' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/self-hosted
            nix/sources.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - env:
          T3_REPAIR_WEBHOOK: ${{ secrets.T3_REPAIR_WEBHOOK }}
          T3_ALERT_WEBHOOK: ${{ secrets.T3_ALERT_WEBHOOK }}
          T3_FAILURE_NEEDS: ${{ toJSON(needs) }}
        run: T3_FAILURE_RELEASE_TAG="v$(jq -r .version nix/sources.json)" node scripts/self-hosted/report-failure.ts build
