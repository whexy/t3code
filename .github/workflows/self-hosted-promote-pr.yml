# Keeps one pull request open from dev into self-hosted-nightly while dev has
# commits the fleet has not got. Merging it with a merge commit, the only
# method self-hosted-nightly's ruleset allows, pushes self-hosted-nightly,
# which self-hosted-build.yml builds and publishes. Its head is dev itself, so
# it follows every merge into dev. The next upstream stable release promotes dev
# anyway, and self-hosted-rebase.yml closes the pull request then.
name: self-hosted-promote-pr

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: promote-pr
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote-pr:
    # The App pushes dev only in a rebase run, which promotes it right after.
    if: github.actor != 'whexy-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BODY: |
            Merging this ships every commit below to the fleet: the merge commit lands on `self-hosted-nightly`, whose build publishes the images, the Nix server, the desktop and iOS apps, and starts the dotfiles pin lane.

            Use **Create a merge commit**; the branch ruleset allows no other method. This pull request follows `dev` as more pull requests merge. The next upstream stable release promotes `dev` on its own and closes it.
        run: |
          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/self-hosted-nightly...dev" --jq .ahead_by)"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base self-hosted-nightly --head dev --state open \
            --json number --jq length)"
          echo "dev is $ahead commit(s) ahead of self-hosted-nightly; $open promote pull request(s) open" |
            tee -a "$GITHUB_STEP_SUMMARY"
          if ((ahead == 0 || open > 0)); then exit 0; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base self-hosted-nightly --head dev \
            --title "chore(release): promote dev to self-hosted-nightly" --body "$BODY"
