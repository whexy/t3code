\* Two clicks, two link drops (one may come before the host has any sign of a select), an unattended select, apps joining `desired` unasked (twice), a lost message, a T3 restart, a hand select.
\* The chosen design: every design choice on. check.sh also runs this file with
\* each choice turned off, and with all of them off (the design as approved).
CONSTANTS
  NumClicks = 2
  MaxLoss = 1
  MaxEnds = 0
  MaxRestarts = 1
  MaxOverruns = 0
  MaxHand = 1
  MaxInconclusive = 0
  MaxCreateFails = 0
  MaxDrops = 2
  MaxEarlyDrops = 1
  MaxUnattended = 1
  MaxWatches = 2
  Holders = TRUE
  TakeoverCheck = TRUE
  AbandonOnlyOnFailure = TRUE
  ClientDeadline = TRUE
  WorktreeLock = TRUE
  RestartRearm = TRUE
  WriteAheadCreate = TRUE
  OwnerLatch = TRUE
  LatchPersisted = TRUE
  HandOff = TRUE
  UnaskedNeverOwns = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverKillSignalled NoFalseSign SelectedKillOnlyWithoutSign HandKillOnlyInAcceptedGaps NoOrphan OneSessionPerWorktree KillsOnlyUnconfirmed
CHECK_DEADLOCK FALSE
