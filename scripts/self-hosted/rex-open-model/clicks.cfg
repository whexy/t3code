\* Three clicks (A, B, A), no restart, no hand select, no disconnect: a lost message, a closed session, an overrun, a select timeout.
\* The chosen design: every design choice on. check.sh also runs this file with
\* each choice turned off, and with all of them off (the design as approved).
CONSTANTS
  NumClicks = 3
  MaxLoss = 1
  MaxEnds = 1
  MaxRestarts = 0
  MaxOverruns = 1
  MaxHand = 0
  MaxTimeouts = 1
  MaxCreateFails = 0
  MaxDrops = 0
  MaxEarlyDrops = 0
  MaxUnattended = 0
  MaxWatches = 0
  Holders = TRUE
  TakeoverCheck = TRUE
  AbandonOnlyOnFailure = TRUE
  ClientDeadline = TRUE
  WorktreeLock = TRUE
  RestartRearm = TRUE
  WriteAheadCreate = TRUE
  OwnerLatch = TRUE
  LatchPersisted = TRUE
  HandOff = TRUE
  UnaskedNeverOwns = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverKillSignalled NoFalseSign SelectedKillOnlyWithoutSign HandKillOnlyInAcceptedGaps NoOrphan OneSessionPerWorktree KillsOnlyUnconfirmed NeverKillSelected
PROPERTY NoDangling
CHECK_DEADLOCK FALSE
