\* Two clicks (Mac A, Mac B), one of every fault but disconnects: a lost message, a session closed in Rex, a T3 restart, a click that outlasts its lease, a hand select, a select timeout, a failed rex new. No Mac goes offline, so (a) holds in full.
\* The chosen design: every design choice on. check.sh also runs this file with
\* each choice turned off, and with all of them off (the design as approved).
CONSTANTS
  NumClicks = 2
  MaxLoss = 1
  MaxEnds = 1
  MaxRestarts = 1
  MaxOverruns = 1
  MaxHand = 1
  MaxTimeouts = 1
  MaxCreateFails = 1
  MaxDrops = 0
  MaxEarlyDrops = 0
  MaxUnattended = 0
  MaxWatches = 0
  Holders = TRUE
  TakeoverCheck = TRUE
  AbandonOnlyOnFailure = TRUE
  ClientDeadline = TRUE
  WorktreeLock = TRUE
  RestartRearm = TRUE
  WriteAheadCreate = TRUE
  OwnerLatch = TRUE
  LatchPersisted = TRUE
  HandOff = TRUE
  UnaskedNeverOwns = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverKillSignalled NoFalseSign SelectedKillOnlyWithoutSign HandKillOnlyInAcceptedGaps NoOrphan OneSessionPerWorktree KillsOnlyUnconfirmed NeverKillSelected
PROPERTY NoDangling
CHECK_DEADLOCK FALSE
