\* The t3-push design, phone with Live Activities off and notifications on (no card),
\* one fault class: crash.
CONSTANTS
  Hosts = {"h1", "h2"}
  MaxChanges = 2
  MaxTouches = 0
  MaxCrashes = 1
  MaxApnsFailures = 0
  MaxTimeouts = 0
  MaxPrefChanges = 0
  StartModes = {"notes"}
  RetryBudget = 1
  RetryForever = TRUE
  ReplyAfterDelivery = TRUE
  SerializeDelivery = TRUE
  StartupReconcile = TRUE
  WriteAheadSend = TRUE
  ForgetOnFailure = TRUE
  HonorLiveActivitiesOff = TRUE
  AlertsNeedNotifications = TRUE
  NotifyFromPublishedThread = TRUE
  NotifyOncePerPhase = TRUE
  EndIsFinal = TRUE
  ReplayAlertsFromBaseline = TRUE
  AlertEveryEnteringRow = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK PushKnowsTruth CardShowsTruth NoDuplicateAlert NoMissedAlert SilentWhenNotificationsOff CardEndsWhenLiveActivitiesOff OnlyEndWhenBothOff NoMissedNotification NoDuplicateNotification
