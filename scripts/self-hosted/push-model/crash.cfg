\* The proposed t3-push design with one fault class: crash.
\* check.sh also runs this file with each design choice turned off.
CONSTANTS
  Hosts = {"h1", "h2"}
  MaxChanges = 2
  MaxCrashes = 1
  MaxApnsFailures = 0
  MaxTimeouts = 0
  RetryBudget = 1
  RetryForever = TRUE
  ReplyAfterDelivery = TRUE
  SerializeDelivery = TRUE
  StartupReconcile = FALSE
  WriteAheadSend = TRUE
  ForgetOnFailure = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK PushKnowsTruth CardShowsTruth NoDuplicateAlert NoMissedAlert
