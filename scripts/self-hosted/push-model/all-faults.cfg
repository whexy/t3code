\* The proposed t3-push design with one fault of every class at once.
\* check.sh runs it only for "deep": it is too large for every change.
CONSTANTS
  Hosts = {"h1", "h2"}
  MaxChanges = 2
  MaxCrashes = 1
  MaxApnsFailures = 1
  MaxTimeouts = 1
  RetryBudget = 1
  RetryForever = TRUE
  ReplyAfterDelivery = TRUE
  SerializeDelivery = TRUE
  StartupReconcile = FALSE
  WriteAheadSend = TRUE
  ForgetOnFailure = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK PushKnowsTruth CardShowsTruth NoDuplicateAlert NoMissedAlert
