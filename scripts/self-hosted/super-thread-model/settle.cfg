\* Settling: two messages, one E2 outage and one settle cascade, launches without faults.
\* check.sh also runs it with design choices turned off.
CONSTANTS
  MaxCrashes = 0
  MaxRetries = 0
  MaxMessages = 2
  MaxOutages = 1
  MaxCascades = 1
  WriteAheadLocal = TRUE
  GuardSettleByRun = TRUE
  LaunchOnlyMembership = TRUE
  ExcludeDelegates = TRUE
  SectionFromAnyUnsettled = TRUE
  SettledMembersLeaveSection = TRUE
  HeaderLeavesShelf = TRUE
  UnsettleHeaderOnly = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK MembersOnlyOwnLaunches AtMostOneGroup NoUnwarnedSettle UnsettledMemberStaysVisible EachThreadPlacedOnce HeaderUnsettleKeepsMembers EveryLaunchJoins
