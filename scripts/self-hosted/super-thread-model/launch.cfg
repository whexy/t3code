\* Launches: one E1 crash, one launch retry, one E2 outage and one member wake while S launches
\* L, R and D.
\* check.sh also runs it with design choices turned off.
CONSTANTS
  MaxCrashes = 1
  MaxRetries = 1
  MaxMessages = 0
  MaxOutages = 1
  MaxWakes = 1
  MaxCascades = 0
  WriteAheadLocal = TRUE
  LaunchOnlyMembership = TRUE
  ExcludeDelegates = TRUE
  SectionFromAnyUnsettled = TRUE
  SettledMembersLeaveSection = TRUE
  HeaderLeavesShelf = TRUE
  UnsettleHeaderOnly = TRUE
  ReplayRemoteLaunch = TRUE
  WakeSkipsSettled = TRUE
  FoldWakes = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK MembersOnlyOwnLaunches AtMostOneGroup UnsettledMemberStaysVisible EachThreadPlacedOnce HeaderUnsettleKeepsMembers WakeNeverReopens OneQueuedWake EveryLaunchJoins
